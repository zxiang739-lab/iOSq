# VTFramePro 编译验证工作流（iOS 工程，使用 xcodebuild 而非 swift build）
name: Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v5
    - name: Build (no code signing)
      run: |
        xcodebuild -project VTFramePro.xcodeproj           -scheme VTFramePro           -configuration Debug           -sdk iphoneos           -destination 'generic/platform=iOS'           CODE_SIGNING_ALLOWED=NO           build
