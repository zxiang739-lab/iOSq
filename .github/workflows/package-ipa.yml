name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "构建配置"
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [[ -d /Applications/Xcode_26.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi
          xcodebuild -version

      - name: Build unsigned IPA
        run: |
          bash scripts/package-ipa.sh --configuration "${{ github.event.inputs.configuration || 'Release' }}"

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: VTFramePro-unsigned.ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
